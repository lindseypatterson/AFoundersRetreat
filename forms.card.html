<script type="text/babel">
const { Input, Select, Checkbox } = window.TheFoundersEditDesignSystem_0cfd4a;
function Demo() {
  return (
    <>
      <Input label="Full name" placeholder="Ada Lovelace" />

      <Select label="Which retreat?" options={['Coastal — May', 'Tuscany — Sept', 'High Desert — Nov']} />
